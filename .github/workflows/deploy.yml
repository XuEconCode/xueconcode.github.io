# 推送到 main 分支后自动构建并发布到 GitHub Pages
# 首次使用：仓库 Settings → Pages → Source 选择「GitHub Actions」
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # 允许在 Actions 页面手动运行
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只进行一次发布，后来的推送排队等待
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install, check, build and upload
        uses: withastro/action@v6
        with:
          node-version: 22

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
