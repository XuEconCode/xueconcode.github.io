- id: platform-employment-2026
  type: publication
  title:
    zh: 平台经济新业态何以促进居民就业——基于包容性就业的视角
    en: "New Forms of Platforms Economy and Individual Employment in China: Perspective from Inclusive Employment"
  authors:
    - { zh: 何小钢, en: Xiaogang He }
    - { zh: 许雯宏, en: Wenhong Xu }
    - { zh: 滕瑞丰, en: Ruifeng Teng }
  venue: { zh: 《南开经济研究》, en: Nankai Economic Studies }
  status: { zh: 2026 年第 3 期, en: "2026, No. 3" }
  abstract:
    zh: >-
      基于城市地图信息、天眼查企业信息和家庭金融调查数据匹配的独特样本，本文利用美团等外卖生活服务平台入驻各城市的时间差异，
      采用渐进倍差法证实：平台入驻通过降低搜寻成本、增加灵活就业和消费拉动就业等渠道，显著提升城市个体就业水平。
      平台还具有包容性就业效应，为在性别、年龄、户籍方面存在就业劣势的群体带来广泛就业机会，并发挥高低技能劳动力的就业互补效应；
      其就业促进效应取决于个体所在地的网络基础设施和市场化水平。本文还测算了平台引致的就业收入规模，揭示了平台为居民收入增加带来的正外部性。
    en: >-
      Using a unique sample that matches urban point-of-interest data, enterprise registration records and the China
      Household Finance Survey, and exploiting the staggered entry of food-delivery platforms such as Meituan across
      cities, we show that platform entry significantly raises individual employment, mainly by lowering job-search
      costs, expanding flexible employment and stimulating consumption-driven jobs. The effect is inclusive: it opens
      opportunities for groups disadvantaged by gender, age, skills or registered residence, and it fosters
      complementary employment between high- and low-skilled workers. Its magnitude depends on local internet
      infrastructure and marketization, and the income it creates points to sizeable positive externalities.
  links:
    paper: https://doi.org/10.14116/j.nkes.2026.03.004
  bibtex: |
    @article{he2026platform,
      title   = {平台经济新业态何以促进居民就业——基于包容性就业的视角},
      author  = {何小钢 and 许雯宏 and 滕瑞丰},
      journal = {南开经济研究},
      year    = {2026},
      number  = {3},
      pages   = {65--82},
      doi     = {10.14116/j.nkes.2026.03.004}
    }
  featured: true

