bio:
  zh: |
    我是许雯宏，江西财经大学数字经济学院产业经济学硕士，本科毕业于华东交通大学网络安全专业（专业排名 1/50）。
    我的研究关注数字经济与劳动力市场：平台经济新业态如何影响居民就业，以及人工智能冲击下劳动者的职业转换与收入不平等。

    计算机与经济学的交叉背景，让我习惯把编程与计量方法结合起来处理大规模数据：曾借助 Qwen 大模型 API
    清洗、分析 1.2 亿条招聘数据，也在探索用 Claude Code 等 AI 工具搭建可复现的研究数据流程。欢迎就研究合作与我联系。
  en: |
    I am Wenhong Xu. I studied Industrial Economics (M.A.) at the School of Digital Economics, Jiangxi University of
    Finance and Economics, after a bachelor's degree in Cyber Security at East China Jiaotong University, where I
    ranked first in my major. My research focuses on the digital economy and labor markets — how new forms of the
    platform economy shape employment, and how exposure to artificial intelligence affects workers' job transitions
    and inequality.

    With a background in both computing and economics, I enjoy combining programming with econometrics on large
    datasets: I have used the Qwen LLM API to clean and analyze 120 million job postings, and I build reproducible
    research pipelines with AI tools such as Claude Code. I am always happy to talk about research collaborations.

email: xuwenhong111@gmail.com

